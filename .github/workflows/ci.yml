name: ci
on: [push, pull_request, workflow_dispatch]
permissions: {contents: read}
concurrency: {group: 'ci-${{ github.workflow }}-${{ github.ref }}', cancel-in-progress: true}
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - {name: GCC shared, cc: gcc, cxx: g++, mode: shared, man: enabled, buildtype: debug}
          - {name: GCC static, cc: gcc, cxx: g++, mode: static, man: disabled, buildtype: debug}
          - {name: Clang shared, cc: clang, cxx: clang++, mode: shared, man: disabled, buildtype: debug}
          - {name: Clang static, cc: clang, cxx: clang++, mode: static, man: disabled, buildtype: debug}
          - {name: GCC release, cc: gcc, cxx: g++, mode: shared, man: disabled, buildtype: release}
    name: '${{ matrix.name }}'
    env: {CC: '${{ matrix.cc }}', CXX: '${{ matrix.cxx }}'}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with: {repository: zeppe-lin/libpkgstate, ref: v3.0.0, path: dependencies/libpkgstate}
      - run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang doxygen libssl-dev mandoc ninja-build pkg-config python3-venv scdoc
          python3 -m venv "$RUNNER_TEMP/meson"
          "$RUNNER_TEMP/meson/bin/pip" install 'meson==1.10.2'
          echo "$RUNNER_TEMP/meson/bin" >> "$GITHUB_PATH"
      - run: ci/configure-and-test.sh build '${{ matrix.mode }}' dependencies/libpkgstate --buildtype='${{ matrix.buildtype }}' -Dman_pages='${{ matrix.man }}'
      - if: matrix.name == 'GCC shared'
        run: doxygen Doxyfile
      - if: matrix.man == 'enabled'
        run: ci/lint-manpages.sh build
      - run: ci/qualify-installed.sh build '${{ matrix.mode }}'
  sanitizers:
    runs-on: ubuntu-24.04
    strategy: {fail-fast: false, matrix: {include: [{name: GCC, cc: gcc, cxx: g++}, {name: Clang, cc: clang, cxx: clang++}]}}
    name: '${{ matrix.name }} address,undefined'
    env: {CC: '${{ matrix.cc }}', CXX: '${{ matrix.cxx }}', ASAN_OPTIONS: 'halt_on_error=1:abort_on_error=1:detect_leaks=1', UBSAN_OPTIONS: 'halt_on_error=1:abort_on_error=1:print_stacktrace=1'}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with: {repository: zeppe-lin/libpkgstate, ref: v3.0.0, path: dependencies/libpkgstate}
      - run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang libssl-dev ninja-build pkg-config python3-venv
          python3 -m venv "$RUNNER_TEMP/meson"
          "$RUNNER_TEMP/meson/bin/pip" install 'meson==1.10.2'
          echo "$RUNNER_TEMP/meson/bin" >> "$GITHUB_PATH"
      - run: ci/configure-and-test.sh build shared dependencies/libpkgstate -Dman_pages=disabled -Db_sanitize=address,undefined -Db_lundef=false
